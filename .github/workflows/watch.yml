name: cloud-watcher

  on:
    schedule:
      # 北京时间 日盘 09:00-15:00 = UTC 01:00-07:00；夜盘 21:00-23:00 = UTC 13:00-15:00
      - cron: "*/15 1-7,13-15 * * 1-5"
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    watch:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-python@v6
          with:
            python-version: "3.11"
        - name: Install deps
          run: pip install --quiet pandas numpy
        - name: Run watcher
          run: python cloud_watch.py 2>&1 | tee out/last_run.txt
        - name: Commit results
          run: |
            git config user.name  "cloud-watcher"
            git config user.email "cloud-watcher@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "watch: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git push
            fi
