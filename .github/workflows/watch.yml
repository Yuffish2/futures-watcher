name: cloud-watcher

on:
  schedule:
    - cron: "*/15 1-7,13-15 * * 1-5"
  workflow_dispatch:
    inputs:
      pushtest:
        description: "发送一条测试推送到微信? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Run watcher
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_TEST: ${{ inputs.pushtest }}
        run: python cloud_watch.py 2>&1 | tee out/last_run.txt

      - name: Commit results
        run: |
          git config user.name  "cloud-watcher"
          git config user.email "cloud-watcher@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "watch: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
