name: cloud-watcher

on:
  schedule:
    # 北京时间 09:00 / 12:00 / 21:00 各启动一次，每次在时段内自己循环 ~2h50m（GitHub 单次上限 6h）
    - cron: "0 1 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      pushtest:
        description: "发送一条测试推送到微信? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Run watcher
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_TEST: ${{ inputs.pushtest }}
          MODE: ${{ inputs.mode }}
        run: python cloud_watch.py session 2>&1 | tee out/last_run.txt

      - name: Commit results
        run: |
          git config user.name  "cloud-watcher"
          git config user.email "cloud-watcher@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "watch: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
