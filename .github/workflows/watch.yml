name: cloud-watcher

on:
  schedule:
    # 北京时间 日盘 09:00-15:00 = UTC 01:00-07:00；夜盘 21:00-23:00 = UTC 13:00-15:00
    # 每 15 分钟一次，只跑周一~周五
    - cron: "*/15 1-7,13-15 * * 1-5"
  workflow_dispatch:          # 也支持在网页上手动点一下就跑

permissions:
  contents: write             # 允许把结果提交回仓库

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Run watcher
        run: python cloud_watch.py

      - name: Commit results
        run: |
          git config user.name  "cloud-watcher"
          git config user.email "cloud-watcher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "watch: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
